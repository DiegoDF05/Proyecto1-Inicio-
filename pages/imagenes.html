<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de imágenes sobre HTML</title>
  <meta name="description" content="Galería de imágenes relacionadas con HTML y el desarrollo web">
  <meta name="keywords" content="HTML, HTML5, lenguaje de marcas, hipertexto, etiquetas, elementos, navegador, web, CSS, JavaScript">
  <meta name="author" content="Diego del Águila">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>
  <h1>Galería de imágenes sobre HTML</h1>

  <h2>El lenguaje de la Web en imágenes</h2>

  <figure>
    <img src="../img/foto1.webp" alt="Logotipo oficial de HTML5, un escudo naranja con el número 5" loading="lazy" width="400">
    <figcaption>Logotipo de HTML5</figcaption>
  </figure>

  <figure>
    <img src="../img/foto2.webp" alt="Código HTML con etiquetas escrito en un editor de texto" loading="lazy" width="400">
    <figcaption>Código HTML en un editor</figcaption>
  </figure>

  <figure>
    <img src="../img/foto3.webp" alt="Página web abierta en un navegador junto a su código fuente" loading="lazy" width="400">
    <figcaption>Una página web en el navegador</figcaption>
  </figure>

  <figure>
    <img src="../img/foto4.webp" alt="Logotipos de HTML, CSS y JavaScript, las tres tecnologías de la Web" loading="lazy" width="400">
    <figcaption>HTML, CSS y JavaScript</figcaption>
  </figure>

  <a href="../index.html">Volver a la página principal</a>

</body>
</html>
